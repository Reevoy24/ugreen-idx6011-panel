name: Build and Release

# Builds every release artifact with the same scripts used locally
# (build-deb.sh / build-tarballs.sh / build-fand.sh), attests build
# provenance, and opens a draft release for the pushed tag.
#
# Two tag lines:
#   v*          ug-paneld bundle: 2 .deb + TrueNAS/Unraid tarballs
#   ug-fand-v*  standalone fan daemon: 1 .deb + TrueNAS/Unraid tarballs
#
# workflow_dispatch builds everything without releasing (CI smoke test).

on:
  push:
    tags:
      - 'v*'
      - 'ug-fand-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:12
    outputs:
      prerelease: ${{ steps.meta.outputs.prerelease }}
      make_latest: ${{ steps.meta.outputs.make_latest }}
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y build-essential libdrm-dev libcurl4-openssl-dev pkg-config git

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Determine release line and version
        id: meta
        shell: bash  # container default is dash; ${version/-/~} is a bashism
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            kind=both
            version=""
          elif [ "${GITHUB_REF_NAME#ug-fand-v}" != "$GITHUB_REF_NAME" ]; then
            kind=fand
            version="${GITHUB_REF_NAME#ug-fand-v}"
          else
            kind=panel
            version="${GITHUB_REF_NAME#v}"
          fi
          prerelease=false
          case "$version" in *beta*) prerelease=true ;; esac
          make_latest=false
          if [ "$kind" = panel ] && [ "$prerelease" = false ]; then
            make_latest=true
          fi
          {
            echo "kind=$kind"
            echo "version=$version"
            echo "dpkg_version=${version/-/\~}"
            echo "prerelease=$prerelease"
            echo "make_latest=$make_latest"
          } >> "$GITHUB_OUTPUT"

      # The tag must match the version compiled into the binaries (shown in
      # the web UI footer), otherwise the release would lie about itself.
      - name: Verify tag matches include/version.h
        if: github.event_name == 'push'
        run: |
          case "${{ steps.meta.outputs.kind }}" in
            panel) macro=UG_VERSION ;;
            fand)  macro=UG_FAND_VERSION ;;
          esac
          grep -q "define $macro \"${{ steps.meta.outputs.version }}\"" include/version.h || {
            echo "::error::Tag $GITHUB_REF_NAME does not match $macro in include/version.h"
            exit 1
          }

      - name: Build ug-paneld artifacts
        if: steps.meta.outputs.kind != 'fand'
        run: |
          make
          ./build-deb.sh ${{ steps.meta.outputs.dpkg_version }}
          ./build-tarballs.sh ${{ steps.meta.outputs.dpkg_version }}

      - name: Build ug-fand artifacts
        if: steps.meta.outputs.kind != 'panel'
        run: ./build-fand.sh ${{ steps.meta.outputs.dpkg_version }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          if-no-files-found: error
          path: |
            *.deb
            *.tar.gz

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - name: Generate checksums
        run: sha256sum *.deb *.tar.gz > SHA256SUMS

      # Signed SLSA provenance: proves each artifact was built by this
      # workflow from this commit. Verify with:
      #   gh attestation verify <file> -R Reevoy24/ugreen-idx6011-panel
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            *.deb
            *.tar.gz

      # Draft so the release notes stay hand-written; publish from the UI.
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ needs.build.outputs.prerelease }}
          make_latest: ${{ needs.build.outputs.make_latest }}
          files: |
            *.deb
            *.tar.gz
            SHA256SUMS
